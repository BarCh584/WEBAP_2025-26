<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

</head>

<body>
    <input type="text" id="passwordInput" placeholder="Enter password to brute-force">
    <input type="number" id="lengthInput" placeholder="Max length to try">
    <input type="submit" id="startButton" value="Start Brute Force">
    <script>
        document.getElementById("startButton").addEventListener("click", function () {
            // Character set (letters, numbers, special characters)
            const charset = "abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*()";

            // Change this to simulate the "target password"
            const targetPassword = document.getElementById("passwordInput").value || "abc"; // Default to "abc" if no input

            // Set max length to try
            const maxLength = document.getElementById("lengthInput").value || 100; // Default to 4 if no input

            let attempts = 0;
            let found = false;

            function bruteForce(current, length) {
                if (found) return;

                if (current.length === length) {
                    attempts++;

                    if (current === targetPassword) {
                        console.log("Password found:", current);
                        console.log("Attempts:", attempts);
                        found = true;
                        return;
                    }

                    return;
                }

                for (let i = 0; i < charset.length; i++) {
                    bruteForce(current + charset[i], length);
                    if (found) return;
                }
            }

            // Try all lengths from 1 up to maxLength
            for (let len = 1; len <= maxLength; len++) {
                bruteForce("", len);
                if (found) break;
            }

            if (!found) {
                console.log("Password not found within length limit.");
            }
        });
    </script>
</body>

</html>
